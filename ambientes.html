<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escolher ambiente · DesignLab</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3f5;color:#173846;font:15px system-ui,Arial;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(730px,100%);background:#fff;border-radius:20px;padding:32px;box-shadow:0 16px 45px #14354528}.over{font-size:12px;letter-spacing:1px;color:#087a7e;font-weight:800}h1{margin:12px 0}p{color:#57727c}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:28px auto;max-width:670px}.opts:has(>a:only-child){grid-template-columns:minmax(0,340px);justify-content:center}.opts a{display:block;text-decoration:none;border:1px solid #d5e1e5;padding:24px;border-radius:12px;font-weight:800;color:#173846}.opts a:hover{border-color:#087a7e;background:#f0f8f8}.opts small{display:block;margin-top:8px;color:#57727c;font-weight:400}.actions{display:flex;gap:12px;flex-wrap:wrap}button{border:0;background:#087a7e;color:white;padding:12px 18px;border-radius:10px;cursor:pointer}.muted{background:#e2edef;color:#174a53}.error{color:#9a2121}@media(max-width:580px){.opts{grid-template-columns:1fr}.card{padding:20px}}</style><script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script></head><body><section class="card"><div class="over">DESIGNLAB · AMBIENTES</div><h1>Onde deseja trabalhar?</h1><p id="status">Consultando suas permissões…</p><div class="opts" id="options" hidden></div><div class="actions"><button id="retry" class="muted" type="button">Tentar novamente</button><button id="exit" type="button">Sair da conta</button></div></section><script>
const statusEl=document.getElementById('status'),opts=document.getElementById('options');
const API='https://designlabmoveis-api.geppetomarcenaria.workers.dev';
function addChoice(title,desc,url){const a=document.createElement('a');a.href=url;a.textContent=title;const small=document.createElement('small');small.textContent=desc;a.appendChild(small);opts.appendChild(a);}
async function load(){opts.hidden=true;opts.textContent='';statusEl.textContent='Consultando suas permissões…';
 if(sessionStorage.getItem('designlab_manual_login_active')!=='yes'){statusEl.textContent='Faça login primeiro.';return;}
 let token=sessionStorage.getItem('designlab_operator_token_active');
 if(!token){for(let i=0;i<20&&!token;i++){const u=window.netlifyIdentity?.currentUser?.();if(u)token=await u.jwt().catch(()=>null);if(!token)await new Promise(r=>setTimeout(r,150));}}
 if(!token){statusEl.textContent='Sua sessão não está disponível. Faça login novamente.';return;}
 try{const controller=new AbortController();const tid=setTimeout(()=>controller.abort(),12000);let res;try{res=await fetch(API+'/me',{headers:{Authorization:'Bearer '+token},cache:'no-store',signal:controller.signal});}finally{clearTimeout(tid)}const data=await res.json();if(!res.ok)throw Error(data.message||'Autorização negada');const u=data.user||{};const role=u.role==='admin'?'admin':u.access_role;if(u.role!=='admin'&&u.access_status!=='approved')throw Error('Sua conta ainda não foi aprovada.');
 if(role==='admin'||role==='geral'){addChoice('DesignLab','Projetos, modelagem e plano de corte','./index.html?trocar-ambiente=1');addChoice('Seccionadora','Planos, ZAW e etiquetas','./planoslab.html?machine=seccionadora');addChoice('CNC','Arquivos DXF para Aspire e acompanhamento','./planoslab.html?machine=cnc');}
 else if(role==='supervisor'){addChoice('Projetos · Supervisor','Consulta somente leitura','./supervisor.html');}
 else if(['cnc','seccionadora','ambas'].includes(role)){if(role==='cnc'||role==='ambas')addChoice('CNC','Consultar ordens da CNC','./planoslab.html?machine=cnc');if(role==='seccionadora'||role==='ambas')addChoice('Seccionadora','Planos, ZAW e etiquetas','./planoslab.html?machine=seccionadora');}
 else throw Error('Perfil ainda não autorizado');opts.hidden=false;statusEl.textContent='Escolha um dos ambientes autorizados.';
 }catch(err){statusEl.textContent='Erro de autorização: '+(err.message||err);statusEl.className='error';}}
document.getElementById('retry').onclick=load;
document.getElementById('exit').onclick=()=>{sessionStorage.removeItem('designlab_manual_login_active');sessionStorage.removeItem('designlab_operator_token_active');sessionStorage.removeItem('designlab_environment_switch_pending');try{window.netlifyIdentity?.logout?.()}catch{}location.replace('./index.html')};
load();
</script></body></html>
