<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>DesignLab · Projeto</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#173840;background:#eef3f4}*{box-sizing:border-box}body{margin:0}.shell{max-width:880px;margin:0 auto;padding:22px 15px 50px}header{display:flex;align-items:center;gap:12px;padding-bottom:15px;border-bottom:1px solid #dce5e7}.mark{display:grid;place-items:center;background:#087879;color:#fff;width:43px;height:43px;border-radius:12px;font-weight:900}h1{font-size:22px;margin:0}h2{font-size:19px}.muted{color:#607983}.card{background:white;border:1px solid #dee7ea;border-radius:16px;padding:20px;margin-top:15px;box-shadow:0 6px 28px #103d4807}.pill{display:inline-block;font-size:12px;padding:6px 9px;border-radius:30px;background:#e2f5ee;color:#17634b}.summary{display:flex;flex-wrap:wrap;gap:18px}.summary div{min-width:100px}.summary strong{display:block;font-size:20px}.part{padding:15px 0;border-bottom:1px solid #edf1f2}.part:last-child{border:0}.part b{display:block}.part small{color:#657e84}.edge{color:#087777;font-size:12px;margin-top:5px}#notice{padding:13px;background:#fff8e5;border-radius:10px}footer{margin-top:30px;font-size:12px;color:#647e85}</style></head><body><main class="shell"><header><div class="mark">DL</div><div><h1>DesignLab · Projeto</h1><div class="muted">Consulta pública · somente visualização</div></div></header><section class="card"><div id="notice">Carregando projeto…</div><div id="project" hidden><span class="pill">Projeto publicado</span><h2 id="name"></h2><p id="number" class="muted"></p><div class="summary"><div><small>Peças</small><strong id="count"></strong></div><div><small>Revisão</small><strong id="revision"></strong></div></div></div></section><section class="card" id="listCard" hidden><h2>Peças do projeto</h2><div id="pieces"></div></section><footer>Os dados são informativos. Medidas e operações de produção devem ser conferidas pelo responsável técnico. Links públicos podem ser desativados pelo administrador.</footer></main><script>const API='https://designlabmoveis-api.geppetomarcenaria.workers.dev';const $=id=>document.getElementById(id);const token=new URLSearchParams(location.search).get('t')||'';async function load(){if(!/^[a-f0-9]{32}$/.test(token)){ $('notice').textContent='QR Code inválido.';return;}try{const res=await fetch(API+'/public/pedidos/'+token,{cache:'no-store'});const data=await res.json();if(!res.ok||!data.ok)throw Error(data.message||'Projeto indisponível.');const p=data.project;$('notice').hidden=true;$('project').hidden=false;$('listCard').hidden=false;$('name').textContent=p.name||'Projeto';$('number').textContent='Pedido '+(p.orderNumber||'—');$('count').textContent=p.pieces.length;$('revision').textContent=p.revision||1;for(const part of p.pieces){const box=document.createElement('div');box.className='part';const name=document.createElement('b');name.textContent=part.name;const meta=document.createElement('small');meta.textContent=[part.length,part.width,part.thickness].join(' × ')+' mm'+(part.material?' · '+part.material:'');box.append(name,meta);const bands=Object.values(part.edgeBands||{}).filter(Boolean).map(b=>b.name);if(bands.length){const e=document.createElement('div');e.className='edge';e.textContent='Fitas: '+bands.join(' · ');box.append(e)}$('pieces').append(box)}}catch(e){$('notice').textContent=e.message||'Não foi possível carregar este projeto.'}}load();</script></body></html>
