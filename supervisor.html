<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supervisor · Projetos</title><script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script><style>body{font-family:system-ui;margin:0;background:#edf3f5;color:#15343f}main{max-width:1100px;margin:30px auto;padding:20px}.card{background:#fff;border:1px solid #d4e1e4;border-radius:14px;padding:18px;margin:12px 0}button{padding:10px 16px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:55vh;overflow:auto}small{color:#51717b}</style></head><body><main><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h1>👁 Supervisor de Projetos</h1><button id="supervisorLogout" type="button">Sair da conta</button></div><p>Consulta somente leitura. Sem edição, exclusão ou envio para produção.</p><div id="status" class="card">Validando acesso…</div><div id="projects"></div><div id="details" class="card" hidden></div></main><script>
document.getElementById('supervisorLogout').onclick=()=>{
  sessionStorage.removeItem('designlab_manual_login_active');
  sessionStorage.removeItem('designlab_operator_token_active');
  sessionStorage.removeItem('designlab_environment_switch_pending');
  document.querySelector('main').hidden=true;
  try{window.netlifyIdentity?.logout?.()}catch(err){console.warn('Falha ao solicitar logout remoto:',err)}
  location.replace('./index.html');
};
const API='https://designlabmoveis-api.geppetomarcenaria.workers.dev';const status=document.getElementById('status');const items=document.getElementById('projects');
async function request(path){const u=window.netlifyIdentity?.currentUser?.();const t=sessionStorage.getItem('designlab_operator_token_active')||(u?await u.jwt().catch(()=>null):null);if(!t||sessionStorage.getItem('designlab_manual_login_active')!=='yes')throw Error('Faça login no DesignLab.');const r=await fetch(API+path,{headers:{Authorization:'Bearer '+t},cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.message||'Acesso negado');return j;}
async function start(){try{if(sessionStorage.getItem('designlab_manual_login_active')!=='yes')throw Error('Faça login manualmente.');const me=await request('/me');if(me.user.access_status!=='approved'||!['supervisor','admin'].includes(me.user.role==='admin'?'admin':me.user.access_role))throw Error('Você não tem acesso de supervisor.');const data=await request('/supervisor/projects');status.textContent=data.projects.length+' projeto(s) disponível(is) para consulta.';for(const p of data.projects){const b=document.createElement('button');b.className='card';b.style.display='block';b.style.width='100%';b.style.textAlign='left';b.textContent=p.name+' · '+(p.updated_at||'');b.onclick=async()=>{try{const d=await request('/projects/'+encodeURIComponent(p.id));const box=document.getElementById('details');box.hidden=false;box.replaceChildren();const h=document.createElement('h2');h.textContent=d.project.name;const note=document.createElement('small');note.textContent='Dados do projeto para conferência · somente leitura';const pre=document.createElement('pre');pre.textContent=JSON.stringify(d.record,null,2);box.append(h,note,pre);}catch(e){status.textContent=e.message;}};items.append(b);}}catch(e){status.textContent=e.message+' Volte ao login principal.';}}
(async()=>{try{window.netlifyIdentity?.init?.();}catch{}await start();})();
</script></body></html>
